name: Build and publish CRM image

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  create:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'deploy/production/**'
      - '.dockerignore'
      - '.github/workflows/crm-image.yml'
      - 'Gemfile*'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

# One build per ref: a tag fires both "push" and "create", and the newer run replaces the older one.
concurrency:
  group: crm-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # "create" also fires for new branches (its tag filter is ignored), and those builds publish nothing.
    if: github.event_name != 'create' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Define image and revision
        id: release
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="$(git rev-parse HEAD)"
          version=development
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          fi
          # The build cache lives in the registry, so every tag and branch reuses the gems and node_modules layers.
          # Pull requests only read it (the package is public); the other events refresh it.
          cache_to=""
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            cache_to="type=registry,ref=$image:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
          fi
          {
            echo "image=$image"
            echo "revision=$revision"
            echo "version=$version"
            echo "cache_to=$cache_to"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build; publish only tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.revision }}
          build-args: |
            CRM_VERSION=${{ steps.release.outputs.version }}
            SOURCE_REVISION=${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.release.outputs.image }}:buildcache
          cache-to: ${{ steps.release.outputs.cache_to }}
