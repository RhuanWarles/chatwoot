# Standalone Stack: local PostgreSQL and Redis with persistent named volumes.
x-app: &app
  image: ${CHATWOOT_IMAGE:-ghcr.io/rhuanwarles/chatwoot:v1.0.10}
  restart: unless-stopped
  environment: &app-env
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    RAILS_LOG_TO_STDOUT: enabled
    RAILS_SERVE_STATIC_FILES: 'true'
    FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?Set encryption key}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?Set encryption key}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?Set encryption salt}
    FORCE_SSL: ${FORCE_SSL:-true}
    ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
    DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt_BR}
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DATABASE: ${POSTGRES_DATABASE:-chatwoot}
    POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_REGION: ${AWS_REGION:-}
    MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-Atendimento <atendimento@example.com>}
    SMTP_ADDRESS: ${SMTP_ADDRESS:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_DOMAIN: ${SMTP_DOMAIN:-example.com}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
    SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
    SMTP_OPENSSL_VERIFY_MODE: ${SMTP_OPENSSL_VERIFY_MODE:-peer}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
    EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-}
  volumes:
    - storage_data:/app/storage

services:
  prepare:
    <<: *app
    restart: 'no'
    entrypoint: []
    command: [bundle, exec, rails, 'db:chatwoot_prepare']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    <<: *app
    depends_on:
      prepare: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    entrypoint: /app/docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, '3000', -b, '0.0.0.0']
    environment:
      <<: *app-env
      PIDFILE: /tmp/chatwoot-server.pid
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, 'u=URI("http://127.0.0.1:3000/health");r=Net::HTTP.start(u.host,u.port,open_timeout:2,read_timeout:3){|h|q=Net::HTTP::Get.new(u);q["X-Forwarded-Proto"]="https";h.request(q)};exit(r.code=="200" ? 0 : 1)']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
  worker:
    <<: *app
    depends_on:
      prepare: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  storage_data:
    name: ${STORAGE_VOLUME:-chatwoot_crm_storage}

  postgres_data:
    name: ${POSTGRES_VOLUME:-chatwoot_crm_postgres}
  redis_data:
    name: ${REDIS_VOLUME:-chatwoot_crm_redis}
